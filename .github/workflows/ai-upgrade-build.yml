name: Build and type-check

on:
  push:
    branches:
      - ai-upgrade
  pull_request:
    branches:
      - 2.0
      - ai-upgrade

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

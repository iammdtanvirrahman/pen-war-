<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Background subtle cyan glow -->
    <radialGradient id="fl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Slender Matte Drafting Barrel -->
    <linearGradient id="fl-barrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e33"/>
      <stop offset="20%" stop-color="#1f2327"/>
      <stop offset="50%" stop-color="#121518"/>
      <stop offset="80%" stop-color="#23272c"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>

    <!-- Metal needle tip and rings -->
    <linearGradient id="fl-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Knurled grip pattern -->
    <pattern id="fl-knurl" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 8 M 8 0 L 0 8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>

    <filter id="fl-shadow" x="-10%" y="-10%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="80" rx="260" ry="40" fill="url(#fl-glow)" />

  <g filter="url(#fl-shadow)">
    <!-- Fine Needle Tip (0.4mm metal sleeve) -->
    <rect x="30" y="78.8" width="22" height="2.4" rx="0.5" fill="#f8fafc"/>
    <rect x="26" y="79.3" width="5" height="1.4" fill="#00f0ff"/>

    <!-- Slender Metal Nose Cone -->
    <polygon points="52,80 82,68 82,92" fill="url(#fl-steel)"/>
    <line x1="82" y1="68" x2="82" y2="92" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Knurled Drafting Grip Collar -->
    <rect x="83" y="67.5" width="45" height="25" fill="#1e293b"/>
    <rect x="83" y="67.5" width="45" height="25" fill="url(#fl-knurl)"/>
    <rect x="128" y="67" width="4" height="26" fill="url(#fl-steel)"/>

    <!-- Main Slender Barrel (Narrower diameter, straight flight profile) -->
    <rect x="132" y="67.5" width="320" height="25" rx="3" fill="url(#fl-barrel)"/>

    <!-- Technical Calibrated Ruler Markings on Barrel -->
    <g stroke="#94a3b8" stroke-width="1" opacity="0.6">
      <line x1="160" y1="67.5" x2="160" y2="73"/>
      <line x1="170" y1="67.5" x2="170" y2="76"/>
      <line x1="180" y1="67.5" x2="180" y2="73"/>
      <line x1="190" y1="67.5" x2="190" y2="76"/>
      <line x1="200" y1="67.5" x2="200" y2="74"/>
      <line x1="210" y1="67.5" x2="210" y2="78"/>
    </g>
    <text x="240" y="82" font-family="'Space Mono', monospace" font-size="7.5" fill="#00f0ff" letter-spacing="1.5">0.40 DRAFTING ISO-3098</text>

    <!-- Metal Ring & Tail Stopper -->
    <rect x="452" y="67.5" width="5" height="25" fill="url(#fl-steel)"/>
    <path d="M 457 68.5 L 485 71 Q 492 80 485 89 L 457 91.5 Z" fill="#0f172a"/>

    <!-- Slender Matte Wire Pocket Clip -->
    <path d="M 454 65 L 365 65 Q 360 65 360 68 Q 360 71 366 71 L 454 71" fill="none" stroke="url(#fl-steel)" stroke-width="3"/>
  </g>

  <!-- Technical Spec Label -->
  <text x="300" y="130" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="3">PRECISION FINELINER · HIGH STABILITY 38g</text>
</svg>
